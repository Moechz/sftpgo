# SFTPGo for TOS 7 — nginx 反代（External Open / 新标签页模式）
# 官方模板: help.terra-master.com → Deb Development Specification → Nginx Configuration
# 安装位置: /usr/local/sftpgo/nginx/sftpgo.conf（平台加载）+ /etc/nginx/conf.d/sftpgo.conf（兜底）
#
# 路由总览（后端全部仅监听回环，经 TOS web 端口 8181 对外）：
#   /sftpgo/            → httpd 8095（WebAdmin/WebClient，前缀保留直通）
#   /sftpgo/webdav/     → webdavd 8096（WebDAV，前缀保留直通，binding.prefix=/sftpgo/webdav）
#   /sftpgo/api/        → httpd 8095 /api/（REST API，剥前缀）
#   /sftpgo/privacy/    → 本机静态隐私政策页
# nginx 按最长前缀匹配，webdav/api/privacy 自动优先于 /sftpgo/

# ---- 无尾斜杠入口（坑 13：/sftpgo 不匹配下面的前缀 location，落到 TOS 默认
#      会 301 丢端口；这里用精确匹配发相对 302，保留 origin+端口）----
location = /sftpgo {
    absolute_redirect off;
    return 302 /sftpgo/;
}

# ---- WebDAV（挂载点 http://<NAS>:8181/sftpgo/webdav/，用户凭据认证后即进入各自 home）----
# proxy_pass 不带 URI → 完整原 URI 直通，与 webdavd binding.prefix 精确对齐，
# webdavd 自产的 302（补尾斜杠）自带前缀，客户端不丢路径
# ★ ^~ 前缀匹配：优先级高于正则 location —— 必须带（pi-agent 侧实测，指南坑 65）。
# TOS「应用访问控制」会生成 `location ~ ^/<appid>/(.*) { auth_request …; try_files … =404; }`（正则、无反代），
# 按 nginx 顺序（= → ^~ → 正则 → 普通前缀）正则赢 → 本段反代永不被选中，应用表现为"只显示落地页/302→桌面/404"。
location ^~ /sftpgo/webdav/ {
    proxy_pass http://127.0.0.1:8096;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 大文件上传/下载：不限体量、不落盘缓冲（后端自己做断点/限额）
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# ---- REST API（脚本/自动化用，与 Web UI 同源）----
location ^~ /sftpgo/api/ {
    proxy_pass http://127.0.0.1:8095/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# ---- Web UI（WebAdmin / WebClient）----
# 前缀保留直通：SFTPGo 原生 httpd.web_root=/sftpgo，页面/资源/重定向全自带前缀
location ^~ /sftpgo/ {
    proxy_pass http://127.0.0.1:8095;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket 升级（官方模板要求实时类应用携带）
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # WebClient 浏览器上传：不限体量、不缓冲
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# ---- 隐私政策（静态页，随包分发；入口见 webui 占位页与应用介绍）----
location ^~ /sftpgo/privacy/ {
    alias /usr/local/sftpgo/privacy/;
    index privacy-policy.html;
    default_type text/html;
}
